{%- comment -%} Sound system hero: schematic of the two stacks and the rack (not to scale). {%- endcomment -%}

  <rect class="sv-box" x="0" y="84" width="240" height="60"/>
  <rect class="sv-cone" x="16" y="92" width="208" height="44"/>
  <rect class="sv-acc" x="112" y="110" width="16" height="8"/>

<figure class="stacks-figure">
  <svg class="stacks" viewBox="0 0 1200 470" role="img" aria-label="Schéma du sound system : deux stacks de quatre voies (aigu, haut-médium à pavillon, bas-médium, deux caissons W-bin) de part et d'autre d'un rack 10U">
    <g transform="translate(170 0)">{{ stack }}</g>
    <g transform="translate(790 0)">{{ stack }}</g>
    <g class="sv-text">
      <text x="158" y="65" text-anchor="end">AIGU · 2× HF50</text>
      <text x="158" y="119" text-anchor="end">HAUT-MÉD · JBL 2482</text>
      <text x="158" y="205" text-anchor="end">BAS-MÉD · 2× ME-12</text>
      <text x="158" y="352" text-anchor="end">GRAVE · 2× W-BIN</text>
      <text x="1042" y="65">AIGU · 2× HF50</text>
      <text x="1042" y="119">HAUT-MÉD · JBL 2482</text>
      <text x="1042" y="205">BAS-MÉD · 2× ME-12</text>
      <text x="1042" y="352">GRAVE · 2× W-BIN</text>
    </g>
    <path class="sv-cable" d="M500 300C455 300 455 200 410 200M500 380C455 380 455 300 410 300M700 300C745 300 745 200 790 200M700 380C745 380 745 300 790 300"/>
    <g class="sv-rack">
      <text class="sv-text sv-rack-title" x="600" y="206" text-anchor="middle">RACK 10U</text>

        <text x="600" y="251">t.racks DSP 206</text>
        <text x="600" y="291">Crest CPX 2600</text>
        <text x="600" y="331">Ecler APA1000</text>
        <text x="600" y="371">Ecler APA1000</text>
        <text x="600" y="411">Inter-M M700 · secours</text>

    </g>
    <path class="sv-ground" d="M40 444H1160"/>

  <figcaption>Schéma : deux stacks quatre voies et le rack 10U (non à l'échelle).</figcaption>
