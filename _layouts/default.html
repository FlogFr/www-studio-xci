<!doctype html>
<html lang="fr">
<head>
{% include head.html %}
</head>
{%- assign universe = nil -%}
{%- if page.universe %}{% assign universe = site.data.universes | where: "id", page.universe | first %}{% endif -%}
<body data-universe="{{ page.universe | default: 'studio' }}" class="layout-{{ page.layout }}">
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  {% include header.html universe=universe %}
  <main id="contenu">
    {{ content }}
  </main>
  {% include footer.html universe=universe %}
</body>
</html>
